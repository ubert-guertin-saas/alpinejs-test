<!DOCTYPE html>
<html>
  <head>
    <title>Test #1</title>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <style>
      .error {
        background-color: red;
        font-weight: bold;
      }
    </style>
  </head>

  <body x-data="{ isError: false, text: '' }">
    <h1>Super Cool login</h1>

    <form action="#" method="POST">
      <input placeholder="Username" type="text" />
      <input placeholder="Paasowrd" type="password" x-model="text" />
    </form>

    <p x-show="text.length < 8" x-bind:class="{ error: text.length < 8 }">
      Hey, le mot de passe doit avoir plus de 8 caracteres!
    </p>
  </body>
</html>
