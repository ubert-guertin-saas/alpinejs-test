<!DOCTYPE html>
<html>
  <head>
    <title>Test #1</title>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <style>
      .error {
        background-color: red;
        font-weight: bold;
      }
    </style>
  </head>

  <body x-data="{ isError: false, text: '' }">
    <h1 x-text="text">Super Cool login</h1>

    <form action="#" method="POST">
      <input placeholder="Username" type="text" />
      <input
        placeholder="Paasowrd"
        type="password"
        x-bind:class="{'error': text.lenght < 8 }"
        x-bind:model="text"
      />
    </form>
  </body>
</html>
