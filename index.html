<!DOCTYPE html>
<html>
  <head>
    <title>Test #1</title>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <style>
      .red {
        background-color: red;
      }

      .blue {
        background-color: blue;
      }
    </style>
  </head>

  <body x-data="{ state: false }">
    <button
      x-on:click="state = !state"
      x-bind:class="{ 'red': state, 'blue': !state}"
    >
      Click sur le bouton magique !
    </button>
  </body>
</html>
